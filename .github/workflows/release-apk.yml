name: Build & Release Eglantine APK

on:
  push:
    tags:
      - 'v*'
      - '1.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., 1.2.0)'
        required: true
        default: '1.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Optimized APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ./eglantine-v1.2.0-turnip.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || '1.2.0' }}
          name: "Eglantine v1.2.0 (AAA Turnip Build)"
          body: |
            ## Eglantine v1.2.0 — Switch 1 & Switch 2 (NX2) Android Emulator
            - **CPU Backend:** ARM64 Native Code Execution (NCE) + POSIX Fastmem
            - **Memory Engine:** 6GB Extended DRAM Pool (prevents Zelda TOTK / Xenoblade OOM)
            - **GPU Driver:** Mesa Turnip v24.4 Vulkan 1.3 with Adreno GMEM Bypass & UBWC 4.0
            - **Shader Pipeline:** Asynchronous SPIR-V compiler + Reactive GPU Cache Flushing
            - **ROM Parser:** Automatic Switch 1 & Switch 2 Title ID & Title Keys decryption
          files: |
            eglantine-v1.2.0-turnip.apk
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
